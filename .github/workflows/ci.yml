name: Portfolio & Engineering Suite CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: React Portfolio Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  python-suites:
    name: Python Engineering & App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright cryptography streamlit supabase plotly pandas yfinance folium streamlit-folium altair qrcode pillow requests
          python -m playwright install chromium
      - name: Run projects/* pytest suites
        run: |
          for dir in projects/winops projects/mcu-lab projects/authgate projects/systriage projects/qa-telemetry projects/netaudit projects/logpulse projects/uphsd-dms projects/waferbench projects/qa-pilot projects/edgeops projects/mailpilot projects/sitecare; do
            echo "=== Testing $dir ==="
            (cd "$dir" && pytest -v)
          done
      - name: Run full-app pytest suites
        run: |
          for dir in StockPilot StormWatchPH CryptoSight DevChat; do
            echo "=== Testing $dir ==="
            (cd "$dir" && pytest -v)
          done
