[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailpilot"
version = "0.1.0"
description = "AI-powered email triage, intent classification, IMAP/SMTP validator, and reply draft automation"
requires-python = ">=3.11"

[project.scripts]
mailpilot = "mailpilot.cli:main"
