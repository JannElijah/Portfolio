<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaferBench — Semiconductor Telemetry &amp; QA Console</title>
  <style>
    :root { --bg: #071012; --card: #0d1a1d; --border: #1b343a; --accent: #2dd4bf; --ok: #10b981; --fail: #f43f5e; --text: #f4f4f5; --muted: #94a3b8; }
    * { box-sizing: border-box; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px 28px; }
    .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 1.3rem; }
    .sub { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.78rem; }
    select { background: #071012; border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 6px; font-family: monospace; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .kpi { background: var(--card); border: 1px solid var(--border); border-top: 2px solid var(--accent); border-radius: 8px; padding: 12px 14px; }
    .kpi-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; }
    .kpi-val { font-family: monospace; font-size: 1.4rem; font-weight: 700; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1.45fr 1fr; gap: 16px; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; font-family: monospace; }
    th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); }
    .pass { color: var(--ok); font-weight: 700; }
    .fail { color: var(--fail); font-weight: 700; }
    button, a.btn { background: var(--accent); color: #042f2e; border: 0; padding: 7px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.78rem; text-decoration: none; }
    a.btn-sec { background: #071012; border: 1px solid var(--border); color: var(--accent); padding: 6px 11px; border-radius: 6px; font-size: 0.78rem; text-decoration: none; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>WaferBench — MCU Telemetry &amp; QA Release Console</h1>
      <div class="sub">Lot History · Fault-Injection Bench · Voltage/Thermal Trace · CI Release Gate</div>
    </div>
    <div class="controls">
      <select id="lotSelect" onchange="refresh()"></select>
      <label>Fault Prob: <span id="faultLbl">18%</span>
        <input id="faultSlider" type="range" min="0" max="50" value="18" oninput="document.getElementById('faultLbl').textContent = this.value + '%'" style="vertical-align:middle;" />
      </label>
      <button onclick="runSim()">Run Lot Simulation</button>
      <a id="csvLink" class="btn-sec" href="/api/mcu/export.csv">Export CSV</a>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="panel">
      <h2 style="margin:0 0 10px;font-size:0.95rem;">Recent UART Hardware Bench Frames</h2>
      <table>
        <thead><tr><th>Device</th><th>VDD 3.3V</th><th>VCC 5V</th><th>Temp</th><th>Current</th><th>Verdict</th></tr></thead>
        <tbody id="framesBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <div id="qaPanel"></div>
      <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px;">
        <div style="font-size:0.75rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;">VDD 3.3V Rail &amp; Thermal Trend (°C)</div>
        <svg id="trendSvg" viewBox="0 0 360 110" style="width:100%;height:110px;background:#071012;border:1px solid var(--border);border-radius:6px;"></svg>
      </div>
    </div>
  </div>
<script>
async function refresh() {
  const lotSel = document.getElementById('lotSelect');
  const selectedId = lotSel.value || '';
  const qs = selectedId ? ('?lot_id=' + selectedId) : '';
  const res = await fetch('/api/overview' + qs);
  const { lots, lot_summary: lot, recent_frames: frames, qa_gate: gate } = await res.json();

  if (lots && lots.length) {
    lotSel.innerHTML = lots.map(l => `<option value="${l.id}">${l.lot_code}</option>`).join('');
    if (selectedId) lotSel.value = selectedId;
  }
  document.getElementById('csvLink').href = '/api/mcu/export.csv?lot_id=' + (lot.lot_id || '');

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="kpi-label">Active Lot</div><div class="kpi-val" style="font-size:1.05rem;">${lot.lot_code}</div></div>
    <div class="kpi"><div class="kpi-label">Lot Yield</div><div class="kpi-val" style="color:#10b981;">${lot.yield_percent}%</div></div>
    <div class="kpi"><div class="kpi-label">Peak MCU Temp</div><div class="kpi-val">${lot.max_temp_c}°C</div></div>
    <div class="kpi"><div class="kpi-label">Min VDD Droop</div><div class="kpi-val">${lot.min_vdd_3v3}V</div></div>
  `;
  document.getElementById('framesBody').innerHTML = frames.slice(0, 7).map(f => `
    <tr>
      <td>${f.device_id}</td><td>${f.vdd_3v3}V</td><td>${f.vcc_5v}V</td><td>${f.mcu_temp_c}°C</td><td>${f.i_draw_ma}mA</td>
      <td class="${f.verdict === 'PASS' ? 'pass' : 'fail'}">${f.verdict}</td>
    </tr>
  `).join('');

  const s = gate.summary || {};
  document.getElementById('qaPanel').innerHTML = `
    <h2 style="margin:0 0 8px;font-size:0.95rem;">CI Release Gate (${s.suite_name || 'N/A'})</h2>
    <p style="font-size:0.85rem;margin:4px 0;">Verdict: <strong class="${gate.verdict === 'PASS' ? 'pass' : 'fail'}">${gate.verdict}</strong> · Pass Rate: <strong>${s.pass_rate_percent}%</strong></p>
    <p style="font-size:0.8rem;color:#cbd5e1;margin:4px 0;">p50 / p95 Latency: <code>${s.p50_case_s}s / ${s.p95_case_s}s</code> · Build: ${s.build_ref}</p>
  `;

  if (frames.length > 1) {
    const ordered = [...frames].reverse();
    const w = 360, h = 110, pad = 12;
    const temps = ordered.map(f => f.mcu_temp_c);
    const minT = Math.min(...temps) - 2, maxT = Math.max(...temps) + 2;
    const pts = ordered.map((f, i) => {
      const x = pad + (i / (ordered.length - 1)) * (w - pad * 2);
      const y = h - pad - ((f.mcu_temp_c - minT) / Math.max(1, maxT - minT)) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    document.getElementById('trendSvg').innerHTML = `
      <polyline fill="none" stroke="#2dd4bf" stroke-width="2.2" points="${pts}" />
    `;
  }
}
async function runSim() {
  const fault_probability = Number(document.getElementById('faultSlider').value) / 100;
  const r = await fetch('/api/mcu/simulate', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({lot_code: 'LOT-SIM-' + Math.floor(Math.random()*90+10), fault_probability}) });
  const data = await r.json();
  document.getElementById('lotSelect').value = '';
  await refresh();
  if (data.lot_id) {
    document.getElementById('lotSelect').value = String(data.lot_id);
    await refresh();
  }
}
refresh();
</script>
</body>
</html>
