[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitecare"
version = "0.1.0"
description = "Website maintenance auditor, broken-link/SEO/accessibility scanner, sitemap generator, and GitHub CI tracker"
requires-python = ">=3.11"

[project.scripts]
sitecare = "sitecare.cli:main"
