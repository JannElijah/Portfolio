<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPHSD DMS — Institutional Document Workflow</title>
  <style>
    :root { --bg:#0d0b10; --card:#17131d; --card-2:#110e16; --border:#2b2337; --accent:#e11d48; --sky:#38bdf8; --ok:#10b981; --warn:#f59e0b; --text:#f4f4f5; --muted:#a1a1aa; }
    * { box-sizing:border-box; font-family:Inter,system-ui,-apple-system,sans-serif; }
    body { margin:0; background:radial-gradient(960px 420px at 85% -10%, rgba(225,29,72,0.10), transparent), var(--bg); color:var(--text); padding:20px 26px; }
    .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:14px; }
    h1 { margin:0; font-size:1.3rem; letter-spacing:-0.02em; }
    .sub { color:var(--muted); font-size:0.8rem; margin-top:2px; }
    .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
    .kpi { background:var(--card); border:1px solid var(--border); border-radius:9px; padding:11px 14px; }
    .lbl { font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }
    .val { font-size:1.35rem; font-weight:700; margin-top:4px; font-family:ui-monospace,monospace; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
    .pills { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .pill { background:var(--card); border:1px solid var(--border); color:var(--muted); padding:5px 11px; border-radius:999px; font-size:0.75rem; cursor:pointer; }
    .pill.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    .tools-right { display:flex; gap:8px; flex-wrap:wrap; }
    .tools-right input { width:205px; }
    .grid { display:grid; grid-template-columns:270px 1fr; gap:16px; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; min-width:0; }
    label { display:block; font-size:0.73rem; color:var(--muted); margin:9px 0 4px; }
    input, select { width:100%; background:#0b090e; border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-size:0.8rem; }
    button { background:var(--accent); color:#fff; border:0; padding:6px 10px; border-radius:6px; font-weight:600; cursor:pointer; font-size:0.74rem; }
    button.sec { background:#231c2e; border:1px solid #3c314e; color:#e4e4e7; }
    button.ok { background:#065f46; border:1px solid #10b981; color:#ecfdf5; }
    button.warn { background:#78350f; border:1px solid #f59e0b; color:#fde68a; }
    .cols { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .col { border-top:2px solid var(--border); }
    .col[data-stage="SUBMITTED"] { border-top-color:var(--sky); }
    .col[data-stage="IN_REVIEW"] { border-top-color:var(--warn); }
    .col[data-stage="APPROVED"] { border-top-color:var(--ok); }
    .col[data-stage="RETURNED"] { border-top-color:var(--accent); }
    .col h3 { font-size:0.77rem; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
    .doc { background:var(--card-2); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:9px; }
    .ref { font-family:ui-monospace,monospace; font-size:0.7rem; color:#fda4af; }
    .doc-title { font-weight:600; font-size:0.84rem; margin:4px 0; line-height:1.35; }
    .meta { font-size:0.72rem; color:var(--muted); }
    .actions { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none; align-items:center; justify-content:center; padding:20px; z-index:40; }
    .modal-bg.open { display:flex; }
    .modal { width:100%; max-width:520px; background:var(--card); border:1px solid #4c3a63; border-radius:10px; padding:18px; }
    .audit-item { border-left:2px solid var(--accent); padding:6px 10px; margin:8px 0; font-size:0.78rem; background:var(--card-2); border-radius:0 6px 6px 0; }
    @media (max-width: 1080px) {
      .grid { grid-template-columns:1fr; }
      .cols { grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width: 680px) {
      .kpis, .cols { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>UPHSD Document Management System</h1>
      <div class="sub">Role-Based Institutional Routing, Return Remarks &amp; Immutable Audit Pipeline</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <label for="roleSelect" style="margin:0;">Active Role:</label>
      <select id="roleSelect" style="width:auto;display:inline-block;">
        <option value="DEAN">Dean / Reviewer</option>
        <option value="STAFF">Staff / Student</option>
      </select>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <div class="pills" id="deptFilter">
      <span style="font-size:0.75rem;color:var(--muted);">Department:</span>
      <button class="pill active" onclick="setDept('', this)">All</button>
      <button class="pill" onclick="setDept('CCS', this)">CCS</button>
      <button class="pill" onclick="setDept('Registrar', this)">Registrar</button>
      <button class="pill" onclick="setDept('IT Lab', this)">IT Lab</button>
      <button class="pill" onclick="setDept('Accounting', this)">Accounting</button>
    </div>
    <div class="tools-right">
      <input id="searchInput" placeholder="Search title, ref, or submitter..." oninput="renderBoard()" />
      <input id="reviewNoteInput" placeholder="Optional transition note..." />
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2 style="margin:0 0 6px;font-size:0.95rem;">Submit Document</h2>
      <label for="titleInput">Title</label>
      <input id="titleInput" placeholder="e.g. OJT Memorandum Request" />
      <label for="deptInput">Department</label>
      <select id="deptInput">
        <option>CCS</option><option>Registrar</option><option>IT Lab</option><option>Accounting</option>
      </select>
      <label for="userInput">Submitted By</label>
      <input id="userInput" value="Jann Limpiado" />
      <button onclick="submitDoc()" style="margin-top:12px;width:100%;padding:8px;">Submit to Queue</button>
      <div id="msg" style="font-size:0.75rem;margin-top:10px;color:#fda4af;min-height:1.1em;"></div>
    </div>
    <div class="cols" id="board"></div>
  </div>

  <div id="auditModal" class="modal-bg" onclick="closeAudit()">
    <div class="modal" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:8px;">
        <strong id="auditTitle">Audit Trail</strong>
        <button class="sec" onclick="closeAudit()">Close</button>
      </div>
      <div id="auditBody" style="margin-top:10px;max-height:60vh;overflow:auto;"></div>
    </div>
  </div>

<script>
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let activeDept = '';
let cachedDocs = [];

function setDept(dept, el) {
  activeDept = dept;
  document.querySelectorAll('#deptFilter .pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  loadBoard();
}

async function loadBoard() {
  const qs = activeDept ? ('?department=' + encodeURIComponent(activeDept)) : '';
  const res = await fetch('/api/documents' + qs);
  const data = await res.json();
  cachedDocs = data.documents || [];
  renderBoard();
}

function renderBoard() {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const docs = cachedDocs.filter(d =>
    !q || [d.ref_code, d.title, d.submitted_by, d.department, d.remarks].join(' ').toLowerCase().includes(q)
  );

  const pending = docs.filter(d => d.status === 'SUBMITTED' || d.status === 'IN_REVIEW').length;
  const approved = docs.filter(d => d.status === 'APPROVED').length;
  const returned = docs.filter(d => d.status === 'RETURNED').length;
  const approvalPct = docs.length ? Math.round((approved / docs.length) * 100) : 0;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="lbl">Total Documents</div><div class="val">${docs.length}</div></div>
    <div class="kpi"><div class="lbl">Pending Review</div><div class="val" style="color:var(--warn);">${pending}</div></div>
    <div class="kpi"><div class="lbl">Approval Rate</div><div class="val" style="color:var(--ok);">${approvalPct}%</div></div>
    <div class="kpi"><div class="lbl">Returned Items</div><div class="val" style="color:#fda4af;">${returned}</div></div>
  `;

  const stages = [
    { key: 'SUBMITTED', label: 'Submitted' },
    { key: 'IN_REVIEW', label: 'In Review' },
    { key: 'APPROVED', label: 'Approved' },
    { key: 'RETURNED', label: 'Returned' },
  ];

  document.getElementById('board').innerHTML = stages.map(st => {
    const items = docs.filter(d => d.status === st.key);
    return `<div class="panel col" data-stage="${st.key}"><h3>${st.label} (${items.length})</h3>` + items.map(d => `
      <div class="doc">
        <div class="ref">${esc(d.ref_code)} · ${esc(d.department)}</div>
        <div class="doc-title">${esc(d.title)}</div>
        <div class="meta">By ${esc(d.submitted_by)}${d.remarks ? ' · ' + esc(d.remarks) : ''}</div>
        <div class="actions">
          ${d.status === 'SUBMITTED' ? `<button class="sec" onclick="move(${d.id}, 'IN_REVIEW')">Review</button>` : ''}
          ${(d.status === 'SUBMITTED' || d.status === 'IN_REVIEW') ? `<button class="ok" onclick="move(${d.id}, 'APPROVED')">Approve</button>` : ''}
          ${d.status === 'IN_REVIEW' ? `<button class="warn" onclick="move(${d.id}, 'RETURNED', 'Needs revisions')">Return</button>` : ''}
          ${d.status === 'RETURNED' ? `<button class="sec" onclick="move(${d.id}, 'SUBMITTED', 'Resubmitted after revisions')">Resubmit</button>` : ''}
          <button class="sec" onclick="inspectAudit(${d.id})">Audit</button>
        </div>
      </div>`).join('') + `</div>`;
  }).join('');
}

async function submitDoc() {
  const title = document.getElementById('titleInput').value;
  const department = document.getElementById('deptInput').value;
  const submitted_by = document.getElementById('userInput').value;
  const res = await fetch('/api/documents', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({title, department, submitted_by})
  });
  const data = await res.json();
  document.getElementById('msg').textContent = res.ok ? '' : (data.error || 'Submission failed');
  if (res.ok) {
    document.getElementById('titleInput').value = '';
    loadBoard();
  }
}

async function move(id, to_status, defaultNote = '') {
  const role = document.getElementById('roleSelect').value;
  const customNote = (document.getElementById('reviewNoteInput').value || '').trim();
  const note = customNote || defaultNote;
  const res = await fetch('/api/documents/' + id + '/transition', {
    method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({to_status, role, actor: role, note})
  });
  const data = await res.json();
  document.getElementById('msg').textContent = res.ok ? '' : data.error;
  if (res.ok && customNote) document.getElementById('reviewNoteInput').value = '';
  loadBoard();
}

async function inspectAudit(id) {
  const res = await fetch('/api/documents/' + id);
  const { document: doc } = await res.json();
  document.getElementById('auditTitle').textContent = `${doc.ref_code} · ${doc.title}`;
  const trail = doc.audit_trail && doc.audit_trail.length
    ? doc.audit_trail
    : [{actor: doc.submitted_by, role: 'SYSTEM', to_status: doc.status, note: doc.remarks || 'Initial seeded record', created_at: doc.updated_at}];
  document.getElementById('auditBody').innerHTML = trail.map(a => `
    <div class="audit-item">
      <div><strong>${esc(a.actor)}</strong> (${esc(a.role)}) → <span style="color:#fda4af;">${esc(a.to_status)}</span></div>
      <div style="color:var(--muted);">${esc(a.note || '')} · ${esc(String(a.created_at).slice(0,19).replace('T',' '))}</div>
    </div>
  `).join('');
  document.getElementById('auditModal').classList.add('open');
}
function closeAudit() { document.getElementById('auditModal').classList.remove('open'); }
loadBoard();
</script>
</body>
</html>
