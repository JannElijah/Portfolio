services:
  nginx-edge:
    image: nginx:1.27-alpine
    container_name: edgeops-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/edgeops.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      edgeops-gateway:
        condition: service_healthy
    restart: unless-stopped

  edgeops-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edgeops-gateway
    environment:
      - EDGEOPS_HOST=0.0.0.0
      - EDGEOPS_PORT=8000
      - EDGEOPS_NGINX_CONF=/app/nginx/edgeops.conf
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
