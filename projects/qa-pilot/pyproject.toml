[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-pilot"
version = "0.1.0"
description = "Playwright Page Object Model E2E and HTTP API contract testing framework"
requires-python = ">=3.11"
dependencies = ["playwright", "pytest"]

[project.scripts]
qa-pilot = "qa_pilot.cli:main"
